<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Richemont Bakery - Gestion des Recettes (CHF)</title>
  <style>
    body { font-family: 'Times New Roman', serif; background: #f5e6d3; color: #3d2a1a; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .fiche-card { border: 1px solid #c4a080; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    .photo { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
    .price { font-weight: bold; color: #8b5a2b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Richemont Bakery - Gestion des Recettes (CHF)</h1>
    <div id="fiches-container"></div>
  </div>

  <script>
    // ✅ CORRECTION 1 : CHF - Formatage des prix avec virgule (CHF standard)
    function formatCHF(amount) {
      // Convertit en string et remplace le point par une virgule
      const amountStr = amount.toFixed(2).replace('.', ',');
      // Ajoute un espace pour les milliers (ex: 1 000,50)
      return amountStr.replace(/(\d)(?=(\d{3})+(?:\.\d+|$))/g, '$1 ');
    }

    // ✅ CORRECTION 2 : Fonction de validation des prix (compatible CHF)
    function sanitizePrice(priceStr) {
      return priceStr.replace(',', '.').replace(/[^0-9.]/g, '');
    }

    // ✅ CORRECTION 3 : Calcul des coûts avec format CHF
    function calculateCost(recipe) {
      let totalCents = 0;
      for (const ingredient of recipe.ingredients) {
        if (!ingredient.price || ingredient.price.trim() === '') continue;
        const price = parseFloat(sanitizePrice(ingredient.price));
        if (isNaN(price) || price <= 0) continue;
        totalCents += Math.round(price * 100) * ingredient.quantity;
      }
      return formatCHF(totalCents / 100);
    }

    // ✅ CORRECTION 4 : Chemin d'image dynamique (sécurisé)
    const ASSET_PATH = "/assets/images/";

    // ✅ CORRECTION 5 : Chargement sécurisé des données
    async function loadFichesData() {
      // ... (rest of the code remains identical to previous version) ...
    }

    // ✅ CORRECTION 6 : Affichage des prix avec CHF
    function renderFiches(data) {
      const container = document.getElementById('fiches-container');
      container.innerHTML = '';
      
      for (const fiche of data) {
        const card = document.createElement('div');
        card.className = 'fiche-card';
        card.innerHTML = `
          <h2>${fiche.name}</h2>
          <div class="recipe-group">Groupe: ${fiche.group || 'Inconnu'}</div>
          <img src="${ASSET_PATH}fiche-${fiche.no}.jpg" alt="${fiche.name}" class="photo">
          <p class="price">Prix: ${calculateCost(fiche)} CHF</p>
          <p>Rendement: ${fiche.yield} g</p>
          <button class="btn" onclick="openByNo('${fiche.no}')">Voir détails</button>
        `;
        container.appendChild(card);
      }
    }

    // ✅ CORRECTION 7 : Initialisation (identique à la version précédente)
    document.addEventListener('DOMContentLoaded', () => {
      // ... (rest of the code remains identical) ...
    });
  </script>
</body>
</html>
